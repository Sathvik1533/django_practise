[project]
name = "django-practise"
version = "0.1.0"
description = "Django backend engineering practice"
authors = [
    {name = "accept the suggested value if correct"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django (==6.1.*)",
    "mysqlclient (>=2.3.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "django-db-connection-pool[mysql] (>=1.2.6,<2.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "daphne (>=4.1.0,<5.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
